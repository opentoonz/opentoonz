name: Windows Build

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.head_ref != '' }}

on:
  push:
    branches:
      - main
      - edition
    paths:
      - '**/*'                                    # Include all files in the repository
      - '!appveyor.yml'                           # Ignore changes in AppVeyor
      - '!README.md'                              # Exclude README
      - '!doc/**'                                 # Exclude documentation
      - '!**/.github/**'                          # Exclude everything in .github folder
      - '.github/workflows/workflow_windows.yml'  # Include Windows workflow file
      - '.github/workflows/otdev_branding.yml'
      - '.github/ot-dev/**'                       # Include OT-Dev build branding assets
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - edition
      - feat/glb-fx-render  # Run the application gate for the stacked material FX.
      - feat/three-point-light-fx  # Run the application gate for stacked 3D Material changes.
      - feature/3d-fx-transformer  # Run the application gate for the stacked 3D Plane FX.
    paths:
      - '**/*'
      - '!appveyor.yml'
      - '!README.md'
      - '!doc/**'
      - '!**/.github/**'
      - '.github/workflows/workflow_windows.yml'
      - '.github/workflows/otdev_branding.yml'
      - '.github/ot-dev/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Branding:
    if: github.repository == 'OpenAnimationLibrary/opentoonz-dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: .github/ot-dev
      - name: Test SVG template substitution and window branding
        run: python3 -m unittest discover -s .github/ot-dev -p test_brand_build.py -v

  RecorderEncoder:
    if: github.repository == 'OpenAnimationLibrary/opentoonz-dev'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          sparse-checkout: .github/ot-dev/recorder
      - uses: actions/cache@v5
        id: recorder-cache
        with:
          path: |
            recorder-encoder
            recorder-test-decoder
          key: otdev-recorder-windows-2025-x64-${{ hashFiles('.github/ot-dev/recorder/build-ffmpeg.sh') }}
      - uses: msys2/setup-msys2@v2
        if: steps.recorder-cache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-nasm
            make
            diffutils
            tar
            curl
      - name: Build input-restricted recorder encoder
        if: steps.recorder-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash .github/ot-dev/recorder/build-ffmpeg.sh
      - uses: actions/upload-artifact@v6
        with:
          name: OT-Dev-recorder-encoder
          path: recorder-encoder
      - uses: actions/upload-artifact@v6
        with:
          name: OT-Dev-recorder-test-decoder
          path: recorder-test-decoder

  Windows:
    needs: [RecorderEncoder, Branding]
    runs-on: windows-2025
    env:
      # QT related variable
      QT_PATH: ${{ github.workspace }}\thirdparty\qt\5.15.2_wintab\msvc2019_64  # Path to custom Qt

      # Visual Studio related variables
      MSVCVERSION: "Visual Studio 18 2026"  # Visual Studio version
      
      # Boost-related variables      
      BOOST_TOOLSET: "14.3"                 # Boost MSVC Toolset version
      BOOST_VERSION: "1.87.0"               # Boost version
      BOOST_ROOT: C:\local\boost_1_87_0     # Path to Boost library root
      
      # OpenCV-related variables      
      OPENCV_VERSION: "4.13.0"              # OpenCV version
      OpenCV_DIR: C:\tools\opencv\build     # Path to OpenCV

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Inject OT-Dev recorder (Windows CI only)
        shell: pwsh
        env:
          OTDEV_BUILD_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: python .github/ot-dev/recorder/enable.py --build-id $env:OTDEV_BUILD_ID

      - uses: actions/download-artifact@v6
        with:
          name: OT-Dev-recorder-encoder
          path: recorder-encoder
      - uses: actions/download-artifact@v6
        with:
          name: OT-Dev-recorder-test-decoder
          path: recorder-test-decoder

      - name: Brand OT-Dev build
        shell: pwsh
        run: |
          python .github/ot-dev/brand_build.py --template .github/ot-dev/splash-template.svg --output "$env:RUNNER_TEMP/ot-dev-splash.svg" --source-root .
          if ($LASTEXITCODE) { throw 'OT-Dev branding failed' }

      # Cache OpenCV and Boost libraries
      - name: Cache OpenCV and Boost
        id: cache-deps
        uses: actions/cache@v5
        with:
          path: |
            C:\tools\opencv
            ${{ env.BOOST_ROOT }}
          key: ${{ runner.os }}-opencv-boost-${{ env.OPENCV_VERSION }}-boost-${{ env.BOOST_VERSION }}
          restore-keys: |
            ${{ runner.os }}-opencv-boost-${{ env.OPENCV_VERSION }}-boost-

      # Install OpenCV and Boost if the cache is missing
      - name: Install OpenCV and Boost if cache is missing
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          @echo on
          choco install opencv --version=${{ env.OPENCV_VERSION }} -y
          choco install boost-msvc-${{ env.BOOST_TOOLSET }} --version=${{ env.BOOST_VERSION }} -y
        shell: cmd

      # Install custom Qt 5.15.2 with WinTab support
      - name: Install custom Qt 5.15.2 with WinTab support
        run: |
          @echo on
          mkdir thirdparty\qt
          curl -fsSL -o Qt5.15.2_wintab.zip https://github.com/shun-iwasawa/qt5/releases/download/v5.15.2_wintab/Qt5.15.2_wintab.zip
          7z x Qt5.15.2_wintab.zip
          move Qt5.15.2_wintab\5.15.2_wintab thirdparty\qt
        shell: cmd

      - name: Install third-party prebuilt libs (LFS workaround)
        run: |
          @echo on
          curl -fsSL -o thirdparty-libs.zip https://github.com/andeon/opentoonz-thirdparty-libs/releases/download/prebuilt-libs-v1/thirdparty-libs.zip
          7z x -y thirdparty-libs.zip
        shell: cmd    

      # Add msbuild to PATH for build process
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Test recorder consent, capture, and native Windows playback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -s .github/ot-dev/recorder -p 'test_*.py' -v
          if ($LASTEXITCODE) { throw 'Recorder injection tests failed' }
          cmake -S .github/ot-dev/recorder -B recorder-tests -G "$env:MSVCVERSION" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_PATH"
          if ($LASTEXITCODE) { throw 'Recorder test configure failed' }
          cmake --build recorder-tests --config Release --parallel 2
          if ($LASTEXITCODE) { throw 'Recorder test build failed' }
          $env:PATH = "$env:QT_PATH\bin;$env:PATH"
          $env:OTDEV_TEST_FFMPEG = "$env:GITHUB_WORKSPACE\recorder-encoder\ffmpeg.exe"
          $env:OTDEV_TEST_DECODER = "$env:GITHUB_WORKSPACE\recorder-test-decoder\ffmpeg.exe"
          ctest --test-dir recorder-tests -C Release --output-on-failure
          $recorderTestExit = $LASTEXITCODE
          Get-ChildItem recorder-tests/recorder-*.txt | ForEach-Object { Get-Content $_.FullName }
          if ($recorderTestExit) { throw 'Recorder tests failed' }

      # CMake configuration step
      - name: CMake configuration
        run: |
          @echo on
          cd thirdparty
          copy /Y tiff-4.0.3\libtiff\tif_config.vc.h tiff-4.0.3\libtiff\tif_config.h
          copy /Y tiff-4.0.3\libtiff\tiffconf.vc.h tiff-4.0.3\libtiff\tiffconf.h
          copy /Y libpng-1.6.21\scripts\pnglibconf.h.prebuilt libpng-1.6.21\pnglibconf.h

          cd ../toonz
          rmdir /S /Q build
          mkdir build
          cd build

          cmake ..\sources -G "%MSVCVERSION%" -Ax64 -DQT_PATH="%QT_PATH%" -DBOOST_ROOT="%BOOST_ROOT%" -DOpenCV_DIR="%OpenCV_DIR%" -DWITH_WINTAB=Y -DBUILD_EXR_TESTS=ON -DBUILD_EXR_AOV_FX_TESTS=ON -DBUILD_LUT3D_TESTS=ON -DBUILD_GLB_FX_TESTS=ON
        shell: cmd

      - name: Build and test OpenEXR image I/O and level source
        shell: cmd
        run: |
          cd toonz\build
          cmake --build . --config RelWithDebInfo --target tiio_exr_test tiio_exr_level_test --parallel
          if %errorlevel% neq 0 exit /b %errorlevel%
          set "PATH=%QT_PATH%\bin;%GITHUB_WORKSPACE%\thirdparty\glut\3.7.6\lib;%GITHUB_WORKSPACE%\thirdparty\glew\glew-1.9.0\bin\64bit;%GITHUB_WORKSPACE%\thirdparty\libmypaint\dist\64;C:\tools\opencv\build\x64\vc16\bin;%PATH%"
          ctest -C RelWithDebInfo --output-on-failure -R "^tiio_exr(_level)?$"
          if %errorlevel% neq 0 exit /b %errorlevel%

      # Run the focused regression before the longer application build.
      - name: Build and test OpenEXR AOV FX
        shell: cmd
        run: |
          cd toonz\build
          cmake --build . --config RelWithDebInfo --target openexraovfx_test --parallel
          if %errorlevel% neq 0 exit /b %errorlevel%
          set "PATH=%QT_PATH%\bin;%GITHUB_WORKSPACE%\thirdparty\glut\3.7.6\lib;%GITHUB_WORKSPACE%\thirdparty\glew\glew-1.9.0\bin\64bit;%GITHUB_WORKSPACE%\thirdparty\libmypaint\dist\64;C:\tools\opencv\build\x64\vc16\bin;%PATH%"
          ctest -C RelWithDebInfo --output-on-failure -R "^openexraovfx$"
          if %errorlevel% neq 0 exit /b %errorlevel%

      # Run the focused regression before the longer application build.
      - name: Build and test 3D LUT Bake
        shell: cmd
        run: |
          cd toonz\build
          msbuild /p:Configuration=RelWithDebInfo /m /verbosity:minimal stdfx\lut3dbake_test.vcxproj
          if %errorlevel% neq 0 exit /b %errorlevel%
          set "PATH=%QT_PATH%\bin;%GITHUB_WORKSPACE%\thirdparty\glut\3.7.6\lib;%GITHUB_WORKSPACE%\thirdparty\glew\glew-1.9.0\bin\64bit;%GITHUB_WORKSPACE%\thirdparty\libmypaint\dist\64;C:\tools\opencv\build\x64\vc16\bin;%PATH%"
          RelWithDebInfo\lut3dbake_test.exe
          if %errorlevel% neq 0 exit /b %errorlevel%

      - name: Build and test 3D FX rendering
        shell: cmd
        run: |
          cd toonz\build
          msbuild /p:Configuration=RelWithDebInfo /m /verbosity:minimal stdfx\glbmodelfx_test.vcxproj
          if %errorlevel% neq 0 exit /b %errorlevel%
          msbuild /p:Configuration=RelWithDebInfo /m /verbosity:minimal stdfx\threepointlightfx_test.vcxproj
          if %errorlevel% neq 0 exit /b %errorlevel%
          msbuild /p:Configuration=RelWithDebInfo /m /verbosity:minimal stdfx\transform3dfx_test.vcxproj
          if %errorlevel% neq 0 exit /b %errorlevel%
          set "PATH=%QT_PATH%\bin;%GITHUB_WORKSPACE%\thirdparty\glut\3.7.6\lib;%GITHUB_WORKSPACE%\thirdparty\glew\glew-1.9.0\bin\64bit;%GITHUB_WORKSPACE%\thirdparty\libmypaint\dist\64;C:\tools\opencv\build\x64\vc16\bin;%PATH%"
          RelWithDebInfo\glbmodelfx_test.exe
          if %errorlevel% neq 0 exit /b %errorlevel%
          RelWithDebInfo\threepointlightfx_test.exe
          if %errorlevel% neq 0 exit /b %errorlevel%
          RelWithDebInfo\transform3dfx_test.exe
          if %errorlevel% neq 0 exit /b %errorlevel%

      # Build Opentoonz using MSBuild
      - name: Build Opentoonz
        run: |
          @echo on
          cd toonz\build
          msbuild /p:Configuration=RelWithDebInfo /m /verbosity:minimal ALL_BUILD.vcxproj
        shell: cmd

      # Create the package
      - name: Create Package
        run: |
          @echo on
          cd toonz\build
          
          REM Create Opentoonz directory and copy files from RelWithDebInfo
          mkdir Opentoonz
          copy /Y RelWithDebInfo\*.* Opentoonz\
          REM Copy required DLLs for proper functionality
          copy /Y ..\..\thirdparty\glut\3.7.6\lib\glut64.dll Opentoonz
          copy /Y ..\..\thirdparty\glew\glew-1.9.0\bin\64bit\glew32.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libiconv-2.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libintl-8.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libjson-c-2.dll Opentoonz
          copy /Y ..\..\thirdparty\libmypaint\dist\64\libmypaint-1-4-0.dll Opentoonz
          
          REM Copy OpenCV DLL (IMPORTANT: Update path/filename when upgrading OpenCV version)
          copy /Y "C:\tools\opencv\build\x64\vc16\bin\opencv_world4130.dll" Opentoonz
          
          REM Deploy Qt dependencies
          "%QT_PATH%\bin\windeployqt.exe" Opentoonz\Opentoonz.exe --opengl

          REM Add generated OT-Dev-only build manifest/artwork beside OpenToonz.exe
          copy /Y "%RUNNER_TEMP%\ot-dev-splash.svg" Opentoonz\splash.svg

          del /Q Opentoonz\*.pdb  REM Remove .pdb files
          del /Q Opentoonz\vc_redist.x64.exe REM Remove vc_redist.x64.exe file
          
          REM Create portablestuff directory and copy stuff folder
          mkdir Opentoonz\portablestuff
          xcopy /Y /E /I ..\..\stuff .\Opentoonz\portablestuff
        shell: cmd

      - name: Test 3D LUT Bake
        shell: cmd
        run: |
          cd toonz\build\Opentoonz
          lut3dbake_test.exe
          if %errorlevel% neq 0 exit /b %errorlevel%
          del lut3dbake_test.exe

      - name: Test packaged 3D FX rendering
        shell: cmd
        run: |
          cd toonz\build\Opentoonz
          glbmodelfx_test.exe
          if %errorlevel% neq 0 exit /b %errorlevel%
          threepointlightfx_test.exe
          if %errorlevel% neq 0 exit /b %errorlevel%
          transform3dfx_test.exe
          if %errorlevel% neq 0 exit /b %errorlevel%
          del glbmodelfx_test.exe
          del threepointlightfx_test.exe
          del transform3dfx_test.exe

      - name: Package OT-Dev recorder and matching FFmpeg sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $destination = 'toonz/build/Opentoonz/otdev-recorder'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item recorder-encoder/* $destination -Recurse
          Copy-Item .github/ot-dev/recorder/README.md $destination
          & "$destination/ffmpeg.exe" -version
          if ($LASTEXITCODE) { throw 'Packaged recorder encoder does not launch' }

      # Create artifact from the build
      - name: Create Artifact
        run: |
          mkdir artifact
          xcopy toonz\build\Opentoonz artifact\ /E /H /Y
        shell: cmd

      # Upload the generated artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Opentoonz-${{ runner.os }}-${{ github.sha }}
          path: artifact